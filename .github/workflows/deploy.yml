# ==============================================================================
# GitHub Actions CI Workflow for CraftyWrap
# ==============================================================================
# Validates that both Frontend and Backend Docker images build cleanly
# without compilation or dependency errors.
# ==============================================================================

name: CI Pipeline - Container Build Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job: Build & Validate Docker Images
  # ----------------------------------------------------------------------------
  build-and-validate:
    name: Build & Validate Containers
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx (for fast layer caching)
        uses: docker/setup-buildx-action@v3

      - name: 3. Build Express Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Validate build only; do not push image to a registry
          tags: craftywrap-backend:test

      - name: 4. Build Next.js Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000/api
          push: false # Validate build only
          tags: craftywrap-frontend:test
