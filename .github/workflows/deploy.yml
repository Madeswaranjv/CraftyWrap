# ==============================================================================
# GitHub Actions Automated CI/CD Workflow for CraftyWrap
# ==============================================================================
# This workflow automatically triggers on every push to the `main` branch.
#
# It performs two main functions:
#   1. CI (Continuous Integration): Validates that both Frontend and Backend
#      Docker images build cleanly without compilation or dependency errors.
#   2. CD (Continuous Deployment): Triggers automated redeployments on Render
#      using Render Deploy Hooks (Webhooks).
#
# WHY RENDER DEPLOY HOOKS?
#   Render Deploy Hooks are unique POST URLs generated by Render for your Web Service.
#   When GitHub Actions sends an HTTP POST request to this URL, Render automatically
#   pulls the latest commit from `main`, builds the multi-stage Dockerfiles, and deploys.
#   This is the simplest and cleanest method because:
#     - No external Docker Registry (Docker Hub / GHCR) accounts or credentials needed.
#     - Render handles container image caching and zero-downtime rolling deploys.
# ==============================================================================

name: CI/CD Pipeline - CraftyWrap Deployment

on:
  push:
    branches:
      - main
  # Allows manually triggering the workflow from GitHub Actions tab if needed
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Test Docker Images (CI Stage)
  # ----------------------------------------------------------------------------
  build-and-validate:
    name: Build & Validate Containers
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx (for fast layer caching)
        uses: docker/setup-buildx-action@v3

      - name: 3. Build Express Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Validate build only; do not push image to a registry
          tags: craftywrap-backend:test

      - name: 4. Build Next.js Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000/api
          push: false # Validate build only
          tags: craftywrap-frontend:test

  # ----------------------------------------------------------------------------
  # Job 2: Deploy to Render via Deploy Hooks (CD Stage)
  # ----------------------------------------------------------------------------
  deploy-to-render:
    name: Trigger Render Deployment
    needs: build-and-validate # Only deploy if build validation succeeds
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 1. Trigger Backend Render Deploy Hook
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "::warning ::'RENDER_BACKEND_DEPLOY_HOOK' secret is not set in GitHub Secrets. Skipping automatic backend redeploy trigger. Add it under Settings -> Secrets and variables -> Actions to enable automatic deploys."
          else
            echo "Sending deploy signal to Render for Express Backend..."
            HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_BACKEND_DEPLOY_HOOK")
            echo "Render Response (HTTP $HTTP_STATUS):"
            cat response.txt || true
            echo ""
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Backend deploy hook triggered successfully on Render!"
            else
              echo "::error ::Render Backend Deploy Hook failed with HTTP status $HTTP_STATUS"
              exit 1
            fi
          fi

      - name: 2. Trigger Frontend Render Deploy Hook
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_FRONTEND_DEPLOY_HOOK" ]; then
            echo "Note: 'RENDER_FRONTEND_DEPLOY_HOOK' is not set (Frontend is deployed on Vercel or separate provider). Skipping gracefully."
          else
            echo "Sending deploy signal to Render for Next.js Frontend..."
            HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_FRONTEND_DEPLOY_HOOK")
            echo "Render Response (HTTP $HTTP_STATUS):"
            cat response.txt || true
            echo ""
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Frontend deploy hook triggered successfully on Render!"
            else
              echo "::warning ::Frontend deploy hook returned HTTP $HTTP_STATUS"
            fi
          fi

# ==============================================================================
# ALTERNATIVE APPROACH: Pushing to GitHub Container Registry (GHCR)
# ==============================================================================
# If you ever want to build images in GitHub Actions and push them to GHCR instead
# of having Render build the Dockerfile, you would add these steps to Job 1:
#
#   - name: Log in to GitHub Container Registry
#     uses: docker/login-action@v3
#     with:
#       registry: ghcr.io
#       username: ${{ github.actor }}
#       password: ${{ secrets.GITHUB_TOKEN }}
#
#   - name: Build and Push Backend to GHCR
#     uses: docker/build-push-action@v5
#     with:
#       context: ./backend
#       file: ./backend/Dockerfile
#       push: true
#       tags: ghcr.io/${{ github.repository }}/backend:latest
# ==============================================================================
