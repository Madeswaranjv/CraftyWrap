<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .cls-1 { fill: #0d2559; }
      .cls-2 { fill: #d15b47; }
      .cls-3 { fill: #ba4836; }
      .cls-4 { fill: #ffcc4d; }
      .cls-5 { fill: #ffffff; }
      .cls-6 { fill: #f5a974; }
    </style>
  </defs>
  
  <!-- Outer A-Frame Blue Base / Roof Outline -->
  <polygon class="cls-1" points="250 10 10 470 70 470 250 80 430 470 490 470 250 10" />
  <path class="cls-1" d="M70 470 L430 470 L430 490 L70 490 Z" />

  <!-- Roof Fill (Terracotta) -->
  <polygon class="cls-2" points="250 80 70 470 430 470 250 80" />
  <!-- Shadow on Left Half of Roof -->
  <polygon class="cls-3" points="250 80 70 470 250 470 250 80" />

  <!-- Yellow Attic Window -->
  <circle class="cls-4" cx="250" cy="220" r="30" />

  <!-- Side Windows (White Rectangles) -->
  <rect class="cls-5" x="100" y="360" width="45" height="55" />
  <rect class="cls-5" x="355" y="360" width="45" height="55" />

  <!-- Arched Doorway Blue Frame -->
  <path class="cls-1" d="M 190 470 L 190 360 A 60 60 0 0 1 310 360 L 310 470 Z" />
  <!-- Arched Door Inner Panel (Peach) -->
  <path class="cls-6" d="M 205 470 L 205 365 A 45 45 0 0 1 295 365 L 295 470 Z" />
  <!-- Door Center Line Divider -->
  <rect class="cls-2" x="246" y="375" width="8" height="95" />
  <rect class="cls-2" x="205" y="370" width="90" height="8" />
</svg>
